[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rigorpath-api-test"
version = "0.2.0"
description = "Project-agnostic API and Web test runtimes for RigorPath-generated automation projects."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]
web = ["playwright>=1.52,<2", "pytest-playwright>=0.7,<1"]

[project.scripts]
rigorpath-api-test = "rigorpath_api_test.cli:main"

[project.entry-points.pytest11]
rigorpath-web-test = "rigorpath_web_test.pytest_plugin"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/rigorpath_api_test", "src/rigorpath_web_test"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rigorpath-api-test"
version = "0.1.0"
description = "Strict YAML-driven API test runtime for RigorPath-generated automation projects."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27,<1", "PyYAML>=6,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[project.scripts]
rigorpath-api-test = "rigorpath_api_test.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.hatch.build.targets.wheel]
packages = ["src/rigorpath_api_test"]
